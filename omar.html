<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UEFA Champions League Countdown</title>

    <link rel="stylesheet" href="omar.css">
</head>

<body>

    <div class="content">

        <img class="imglogo" src="qassemqassem.jpg" alt="UEFA Champions League Logo">

        <h1 class="title">
            UEFA Champions League Countdown
        </h1>

        <p class="description">
            Countdown to the UEFA Champions League kickoff . 
        </p>

        <p class="date">
            Kickoff Date : September 16 , 2026 • 09:00 PM
       </p>

        <div class="datecontainer">

            <div class="box">
                <p id="days">20</p>
                <span>Days</span>
            </div>

            <div class="box">
                <p id="hours">20</p>
                <span>Hours</span>
            </div>

            <div class="box">
                <p id="minutes">20</p>
                <span>Minutes</span>
            </div>

            <div class="box">
                <p id="seconds">20</p>
                <span>Seconds</span>
            </div>

        </div>

    </div>

    <script src="omar.js"></script>

</body>

</html>
